name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.0.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        run: make check

      - name: Generate icons
        run: make icons

      - name: Build and pack plugin
        run: make package

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"  >> "$GITHUB_OUTPUT"

      - name: Stage release contents
        run: |
          STAGE="release-stage/xp_streamdeck-${{ steps.ver.outputs.tag }}"
          mkdir -p "$STAGE"
          cp com.robertw.xplane.streamDeckPlugin "$STAGE/"
          cp -R out/icons              "$STAGE/icons"
          # Bundle every .streamDeckProfile, preserving the per-model subfolder
          # layout (StreamDeck XL/, Streamdeck 3/, PilotsDeck-Converted/). The
          # streamdeck-profiles/icons/ source library and stray READMEs are
          # dev-only — the archives embed their own images, so keep them out of
          # the release. -m prunes the now-empty icons/ dirs.
          mkdir -p "$STAGE/profiles"
          rsync -am --include='*/' --include='*.streamDeckProfile' --exclude='*' \
            streamdeck-profiles/ "$STAGE/profiles/"
          cp README.md INSTALL.md      "$STAGE/"
          ls -la "$STAGE"
          echo "Bundled profiles:"
          find "$STAGE/profiles" -name '*.streamDeckProfile' | sort

      - name: Create ZIP
        run: |
          cd release-stage
          zip -r "../xp_streamdeck-${{ steps.ver.outputs.tag }}.zip" "xp_streamdeck-${{ steps.ver.outputs.tag }}"

      - name: Build release body from previous release + fresh compare link
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEW_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          PREV_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "")
          PREV_BODY=$(gh release view --json body --jq .body 2>/dev/null || echo "")
          # Drop the previous "Full Changelog" line so it doesn't accumulate across releases.
          CLEAN_BODY=$(printf '%s\n' "$PREV_BODY" | sed -E '/^\*\*Full Changelog\*\*:/d')
          if [ -n "$PREV_TAG" ]; then
            FINAL=$(printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n\n%s' \
              "$REPO" "$PREV_TAG" "$NEW_TAG" "$CLEAN_BODY")
          else
            FINAL="$CLEAN_BODY"
          fi
          {
            echo "body<<RELEASE_EOF"
            printf '%s\n' "$FINAL"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: true
          body: ${{ steps.prev.outputs.body }}
          files: xp_streamdeck-${{ steps.ver.outputs.tag }}.zip
