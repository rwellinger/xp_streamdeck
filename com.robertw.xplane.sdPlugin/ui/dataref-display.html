<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>X-Plane DataRef Display</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<script src="xplane-pi-helpers.js"></script>
		<style>
			.live-preview {
				font-family: monospace;
				color: #aaa;
				font-size: 11px;
				word-break: break-all;
			}
			.live-preview[data-state="not-found"],
			.live-preview[data-state="error"] {
				color: #d97;
			}
		</style>
	</head>
	<body>
		<sdpi-item label="DataRef Path">
			<sdpi-textfield
				setting="datarefPath"
				placeholder="sim/cockpit/autopilot/heading_mag"
				id="datarefField"
				required
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Live Value">
			<span class="live-preview" id="datarefPreview"></span>
		</sdpi-item>
		<sdpi-item label="Label">
			<sdpi-textfield
				setting="label"
				placeholder="optional, shown above the value (e.g. ALT)"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Value Mode">
			<sdpi-select setting="valueMode" default="numeric">
				<option value="numeric">Numeric (default)</option>
				<option value="string">String (data-type DataRefs)</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item>
			<small style="color: #888; font-size: 11px">
				Pick <strong>String</strong> for X-Plane <code>data</code>-type DataRefs
				(byte arrays that represent text, e.g. radio displays). The bytes are
				decoded as ASCII and trimmed at the first <code>\0</code>. Unit Scale
				and Precision are ignored in String mode; <code>%s</code> in Format
				wraps the decoded string (e.g. <code>STK %s</code>).
			</small>
		</sdpi-item>
		<sdpi-item label="Format">
			<sdpi-textfield
				setting="format"
				placeholder="%.0f° (default: %s)"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Unit Scale">
			<sdpi-textfield
				setting="unitScale"
				placeholder="e.g. 1.94384 (m/s → kt)"
				inputmode="decimal"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Precision">
			<sdpi-textfield
				setting="precision"
				placeholder="decimals — overridden by explicit %.Nf"
				inputmode="numeric"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Zero Snap">
			<sdpi-checkbox
				setting="snapZero"
				label="Snap near-zero values to 0 (suppresses ±jitter and -0)"
			></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Zero Threshold">
			<sdpi-textfield
				setting="zeroThreshold"
				placeholder="default 0.1 — |value| ≤ threshold shows 0"
				inputmode="decimal"
			></sdpi-textfield>
		</sdpi-item>
		<script>
			(async () => {
				const field = document.getElementById("datarefField");
				const preview = document.getElementById("datarefPreview");
				if (window.XPlanePI && field) {
					await window.XPlanePI.attachAutocomplete(field, "dataref");
					await window.XPlanePI.attachLivePreview(field, preview);
				}
			})();
		</script>
	</body>
</html>
